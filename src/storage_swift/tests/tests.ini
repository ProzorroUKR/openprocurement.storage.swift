[app:main]
use = egg:documentservice
auth.file = %(here)s/auth.ini
pyramid.reload_templates = true
pyramid.debug_authorization = true
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.debug_templates = true
pyramid.default_locale_name = en
storage = swift
curve = secp384r1
swift.auth_url = https://auth.example.com/v3
swift.auth_version = 3
swift.username = username
swift.password = password
swift.project_name = project_name
swift.project_domain_name = default
swift.user_domain_name = default
swift.proxy_host = https://swift-proxy-test.com
swift.container = test_container_name
swift.temp_url_key = temp_url_key


[server:main]
use = egg:gunicorn
host = 0.0.0.0
port = 6543
backend = gevent

# Begin logging configuration

[loggers]
keys = root, storage_swift

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_storage_swift]
level = DEBUG
handlers =
qualname = storage_swift

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s][%(threadName)s] %(message)s

# End logging configuration
