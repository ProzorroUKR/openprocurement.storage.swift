[project]
name = "storage-swift"
version = "1.0.8"
description = "Open Stack Swift storage for OpenProcurement document service"
readme = "README.md"
license = "Apache-2.0"
keywords = ["web services"]
classifiers = [
  "Framework :: Pylons",
  "Programming Language :: Python",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
requires-python = ">=3.13.0, <3.14"
dependencies = [
    "python-swiftclient>=4.8.0",
    # swiftclient needs it to authenticate against identity API v3
    "python-keystoneclient>=5.6.0",
]

[project.urls]
Homepage = "https://github.com/ProzorroUKR/openprocurement.storage.swift"

[project.entry-points."documentservice.plugins"]
swift = "storage_swift:includeme"

[dependency-groups]
dev = [
    "documentservice",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "webtest>=3.0.4",
]

[tool.uv.sources]
# TODO: repoint to a git tag once the documentservice uv migration lands on master
documentservice = { git = "ssh://git@git.prozorro.gov.ua:28722/cdb/openprocurement.documentservice.git", branch = "CS-22204/transfer-to-uv" }

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -v"
log_cli_level = "INFO"
python_files = ["tests/*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
omit = ["*tests*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
